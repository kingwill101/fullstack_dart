name: taskboard_react_layer
description: A React Dart application (SSR) hosted with Routed.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  react_core: ^0.1.0
  react_js: ^0.1.0
  react_dom: ^0.1.0
  react_web: ^0.1.1
  react_actions: ^0.1.1
  react_server: ^0.1.1
  react_server_routed: ^0.1.1
  routed_core: ^0.5.1
  routed_io: ^0.1.2
  path: ^1.9.1
  taskboard:
    path: ..

dev_dependencies:
  build_runner: ^2.15.3
  react_codegen: ^0.1.0
  react_tool: ^0.2.5
  react_testing: ^0.1.0
  lints: ^6.1.0
  test: ^1.31.2
  server_testing: ^0.4.0
  routed_testing: ^0.4.1

dependency_overrides:
  artisanal: ^0.5.0
